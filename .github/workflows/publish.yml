name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'

# Serialize publish runs. Two quick merges to main would otherwise start two
# concurrent runs that both pass the "already published?" check and then race to
# `npm publish` the same version — the loser gets a 403 and the job goes red.
# Queue (don't cancel) so a later run still publishes anything an earlier one
# didn't get to.
concurrency:
  group: publish-packages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

      - name: Publish changed packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for dir in packages/*/; do
            pkg_name=$(node -p "require('./${dir}package.json').name")
            pkg_version=$(node -p "require('./${dir}package.json').version")
            pkg_private=$(node -p "require('./${dir}package.json').private || false")

            if [ "$pkg_private" = "true" ]; then
              echo "Skipping $pkg_name (private)"
              continue
            fi

            # Already on the registry? Nothing to do.
            if npm view "$pkg_name@$pkg_version" version 2>/dev/null; then
              echo "Skipping $pkg_name@$pkg_version (already published)"
              continue
            fi

            echo "Publishing $pkg_name@$pkg_version"
            publish_log=$(mktemp)
            # pipefail is on by default in Actions' bash, so the pipeline's exit
            # status reflects `npm publish`, not `tee`.
            if (cd "$dir" && npm publish) 2>&1 | tee "$publish_log"; then
              echo "Published $pkg_name@$pkg_version"
            elif grep -qiE "cannot publish over|previously published|E403|403 Forbidden" "$publish_log"; then
              # A concurrent run (or a manual publish) beat us to this exact
              # version — treat as an idempotent skip, not a failure.
              echo "Skipping $pkg_name@$pkg_version (published concurrently)"
            else
              echo "ERROR: failed to publish $pkg_name@$pkg_version"
              exit 1
            fi
          done
